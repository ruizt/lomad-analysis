name: Build and push lomad-sims image

# Rebuild whenever the shared simulation image or the R package source changes.
# Produces ghcr.io/ruizt/lomad-sims:latest — used by all studies in dev/sims/.
on:
  push:
    branches: [main]
    paths:
      - 'dev/sims/Dockerfile'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/sims/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lomad-sims:latest
            ghcr.io/${{ github.repository_owner }}/lomad-sims:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
