name: Build and push lomad-sims image

# Rebuild the shared simulation image. Produces ghcr.io/ruizt/lomad-sims:latest
# — used by all studies in simulations/.
#
# The lomad package source now lives in the companion lomad-package repo and is
# installed from GitHub during the build, so changes to the package no longer
# trigger a rebuild here automatically. Trigger a rebuild manually
# (workflow_dispatch) after releasing a new package version — optionally pass a
# ref via the Dockerfile LOMAD_REF build arg.
# Manual only while lomad-package is private: the default remote install of
# lomad cannot authenticate from this runner. Re-add the push trigger once the
# package repo is public. Meanwhile build locally with
#   bash simulations/build-image.sh --local
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: simulations/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lomad-sims:latest
            ghcr.io/${{ github.repository_owner }}/lomad-sims:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
