# job.yaml — Kubernetes Job template for one calibration run
#
# Used as a reference by submit_sweep.sh (not submitted directly).
#
# Build and push the shared container image from the repo root:
#   docker buildx build --platform linux/amd64 \
#     -t ghcr.io/ruizt/lomad-sims:latest --push .
#
# Submit the full d sweep:
#   bash sims/calibration/tide/submit_sweep.sh

apiVersion: batch/v1
kind: Job
metadata:
  name: lomad-calib-JOBNAME
  namespace: cal-poly-ruiz
  labels:
    app: lomad-calib
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lomad-calib
          image: ghcr.io/ruizt/lomad-sims:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: SIM_D
              value: "SIMVAL_D"
            - name: SIM_S
              value: "200"
            - name: SIM_SEED
              value: "4853"
            - name: SIM_OUT_DIR
              value: "/jobs/output"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: output
              mountPath: /jobs/output
      volumes:
        - name: script
          configMap:
            name: lomad-calib-script
        - name: output
          persistentVolumeClaim:
            claimName: lomad-calib-results
