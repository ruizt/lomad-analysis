# pvc.yaml — shared storage for power study results
#
# Create once before submitting jobs:
#   kubectl apply -n cal-poly-ruiz -f simulations/power/tide/pvc.yaml
#
# Delete when done (removes stored results from the cluster):
#   kubectl delete -n cal-poly-ruiz -f simulations/power/tide/pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lomad-power-results
  namespace: cal-poly-ruiz
spec:
  storageClassName: rook-cephfs-tide
  accessModes: [ReadWriteMany]
  resources:
    requests:
      # 162 cells x 500 replicates, one row per window with no thinning:
      # ~14 MB at s = 50, ~28 MB at s = 100, ~41 MB at s = 150, so ~4.5 GB for
      # the sweep. 7Gi leaves room to rerun a subset in place before fetching.
      storage: 7Gi
