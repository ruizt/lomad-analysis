# job.yaml — Kubernetes Job template for one power-study run.
#
# This is the single source of truth for the Job spec. It is never applied
# directly: submit_sweep.sh and test_one_job.sh fill the ${...} placeholders
# with envsubst and pipe the result to kubectl, so the Job spec is referenced
# from one file the way pvc.yaml and accessor.yaml already are.
#
# Required variables:
#   JOB_NAME NAMESPACE IMAGE CONFIGMAP
#   SIM_D SIM_STRUCTURE SIM_S SIM_SNR SIM_PHI SIM_REPS SIM_SEED SIM_ORACLE
#
# SIM_S is the correlation window; sim.R derives the series length n = 25 s
# from it. SIM_REPS is the replicate count (it was called SIM_S before the
# window became the design factor).
#
# SIM_ORACLE is "TRUE" or "FALSE"; sim.R reads it with as.logical(), and it
# doubles as the `oracle` label so the two sweeps can be told apart with
#   kubectl get jobs -n cal-poly-ruiz -l oracle=TRUE

apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: lomad-power
    structure: "${SIM_STRUCTURE}"
    d: "${SIM_D}"
    s: "${SIM_S}"
    snr: "${SIM_SNR}"
    phi: "${SIM_PHI}"
    oracle: "${SIM_ORACLE}"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lomad-power
          image: ${IMAGE}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: SIM_D
              value: "${SIM_D}"
            - name: SIM_STRUCTURE
              value: "${SIM_STRUCTURE}"
            - name: SIM_S
              value: "${SIM_S}"
            - name: SIM_SNR
              value: "${SIM_SNR}"
            - name: SIM_PHI
              value: "${SIM_PHI}"
            - name: SIM_REPS
              value: "${SIM_REPS}"
            - name: SIM_SEED
              value: "${SIM_SEED}"
            - name: SIM_ORACLE
              value: "${SIM_ORACLE}"
            - name: SIM_OUT_DIR
              value: "/jobs/output"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: output
              mountPath: /jobs/output
      volumes:
        - name: script
          configMap:
            name: ${CONFIGMAP}
        - name: output
          persistentVolumeClaim:
            claimName: lomad-power-results
