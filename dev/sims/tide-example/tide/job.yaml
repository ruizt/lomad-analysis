# job.yaml — Kubernetes Job template for one MVN coverage run
#
# Used as a reference by submit_sweep.sh (not submitted directly).
#
# Build and push the shared container image from the repo root:
#   docker buildx build --platform linux/amd64 \
#     -t ghcr.io/ruizt/lomad-sims:latest --push .
#
# Submit the full n sweep:
#   bash dev/sims/tide-example/tide/submit_sweep.sh

apiVersion: batch/v1
kind: Job
metadata:
  name: mvn-example-JOBNAME
  namespace: cal-poly-ruiz
  labels:
    app: mvn-example
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mvn-example
          image: ghcr.io/ruizt/lomad-sims:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SIM_N
              value: "SIMVAL_N"
            - name: SIM_S
              value: "200"
            - name: SIM_SEED
              value: "7291"
            - name: SIM_OUT_DIR
              value: "/jobs/output"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: output
              mountPath: /jobs/output
      volumes:
        - name: script
          configMap:
            name: mvn-example-script
        - name: output
          persistentVolumeClaim:
            claimName: mvn-example-results
