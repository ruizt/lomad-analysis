# job.yaml — Kubernetes Job template for one power study run
#
# Used as a reference by submit_sweep.sh (not submitted directly).
#
# Submit the full sweep:
#   bash dev/sims/power/tide/submit_sweep.sh

apiVersion: batch/v1
kind: Job
metadata:
  name: lomad-power-JOBNAME
  namespace: cal-poly-lomad
  labels:
    app: lomad-power
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lomad-power
          image: ghcr.io/ruizt/lomad-sims:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: SIM_D
              value: "SIMVAL_D"
            - name: SIM_STRUCTURE
              value: "SIMVAL_STRUCTURE"
            - name: SIM_S
              value: "200"
            - name: SIM_SEED
              value: "2847"
            - name: SIM_OUT_DIR
              value: "/jobs/output"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: output
              mountPath: /jobs/output
      volumes:
        - name: script
          configMap:
            name: lomad-power-script
        - name: output
          persistentVolumeClaim:
            claimName: lomad-power-results
